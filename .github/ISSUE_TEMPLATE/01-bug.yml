# For top level: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: 🪲 [Bug]
description: Submit a bug report
title: '🪲[Bug]: '
labels: ['bug', 'triage']
# For body: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
body:
  - type: markdown
    attributes:
      value: |
        Give information about the bug in the fields below.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Give a description of the bug and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version information
      description: |
        Give the software version you used when the bug occurred.
        For modules, give the output of `$PSVersionTable` and
        `Get-Module -ListAvailable -Name 'ModuleName'`.
        For actions or workflows, give the action or workflow version you used.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: To reproduce
      description: Give the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: code-snippet
    attributes:
      label: Code snippet
      description: Add a code snippet that shows the task you want to do.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: |
        For PowerShell commands, run the command with the `-Debug` and
        `-Verbose` flags.
        Paste the output here.
        For actions or workflows, give the output related to the bug or a link
        to the workflow run.
      render: Shell
    validations:
      required: true
