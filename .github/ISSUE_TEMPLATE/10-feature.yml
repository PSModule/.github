# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
---
name: 🚀 [Feature]
description: Suggest/request a new feature
title: '🚀[Feature]: '
labels: ['feature', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Tell us about your need and
        the result you expect in your own words. No technical plan is needed.
        Maintainers will review your feedback and decide how to route it.

        See the [MSX issue guidance][issues] and
        [planning guidance][planning] for how feedback becomes planned work.

        [issues]: https://msx.no/docs/Ways-of-Working/Issues/
        [planning]: https://msx.no/docs/Ways-of-Working/Issues/Process/Planning/
  - type: textarea
    id: description
    attributes:
      label: Consumer need and expected behavior
      description: |
        What are you trying to do, and who would benefit?
        Why does it matter, and what is difficult or missing today?
        In a real situation, what would you do and expect to happen?
      placeholder: |
        I need to ...
        This matters because ...
        When I ..., I expect ...
    validations:
      required: true
