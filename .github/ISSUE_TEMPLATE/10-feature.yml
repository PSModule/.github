# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
---
name: 🚀 [Feature]
description: Suggest/request a new feature
title: '🚀[Feature]: '
labels: ['feature', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Start with how things work today.
        Tell us who the change helps and why.
        Then tell us what should change and what result you expect.
        Use your own words. A technical plan is not necessary.
        Maintainers review and refine feedback, then select the issue type.

        See the [MSX issue guidance][issues] and
        [planning guidance][planning] for the work process.

        [issues]: https://msx.no/docs/Ways-of-Working/Issues/
        [planning]: https://msx.no/docs/Ways-of-Working/Issues/Process/Planning/
  - type: textarea
    id: description
    attributes:
      label: Current situation and desired change
      description: |
        Tell us how things work today. Include what is not easy or is missing.
        Tell us who the change helps and why.
        Tell us what you want to add or change.
        Give a real example. Include the situation, your action,
        and the result you expect.
      placeholder: |
        Today, ...
        The change helps ... because ...
        I want to ...
        When I ..., I expect ...
    validations:
      required: true
