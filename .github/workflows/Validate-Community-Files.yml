---
name: Community file validation

'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions: {}

concurrency:
  group: community-file-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Community file validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the actual PR head
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up the declared Node.js LTS
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version

      - name: Verify the checked-out PR head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:PR_HEAD_SHA) {
              throw 'Checked-out commit does not match the PR head.'
          }
          Write-Output -InputObject $actualHead

      - name: Install locked validation tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate fixtures and community Markdown
        run: npm run validate
